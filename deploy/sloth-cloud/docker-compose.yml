services:
  sloth-cloud-proxy-relay:
    image: node:22-alpine
    container_name: sloth-cloud-proxy-relay
    restart: unless-stopped
    network_mode: host
    command:
      - node
      - -e
      - |
        const net = require('net');
        const listenHost = '0.0.0.0';
        const listenPort = 12335;
        const upstreamHost = '127.0.0.1';
        const upstreamPort = 12334;
        net.createServer((client) => {
          const upstream = net.connect(upstreamPort, upstreamHost);
          client.pipe(upstream);
          upstream.pipe(client);
          const close = () => {
            client.destroy();
            upstream.destroy();
          };
          client.on('error', close);
          upstream.on('error', close);
        }).listen(listenPort, listenHost, () => {
          console.log('sloth-cloud-proxy-relay listening on ' + listenHost + ':' + listenPort);
        });

  sloth-cloud-db:
    image: mariadb:lts
    container_name: sloth-cloud-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: slothcloud_paymenter
      MYSQL_USER: slothcloud
      MYSQL_PASSWORD: ${SLOTH_DB_PASSWORD:-replace-with-strong-password}
      MYSQL_ROOT_PASSWORD: ${SLOTH_DB_ROOT_PASSWORD:-replace-with-even-stronger-password}
    volumes:
      - ../../runtime/data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - sloth-cloud-net

  sloth-cloud-redis:
    image: redis:7-alpine
    container_name: sloth-cloud-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ../../runtime/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - sloth-cloud-net

  sloth-cloud-paymenter:
    build:
      context: ../../Paymenter-master/Paymenter-master
      dockerfile: Dockerfile.sloth
      network: host
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        http_proxy: ${build_http_proxy:-}
        https_proxy: ${build_https_proxy:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
        no_proxy: ${build_no_proxy:-}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    container_name: sloth-cloud-paymenter
    restart: unless-stopped
    depends_on:
      sloth-cloud-proxy-relay:
        condition: service_started
      sloth-cloud-db:
        condition: service_healthy
      sloth-cloud-redis:
        condition: service_healthy
    ports:
      - "${SLOTH_PAYMENTER_PORT:-18080}:80"
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      NO_PROXY: ${NO_PROXY:-}
      no_proxy: ${no_proxy:-}
    volumes:
      - ../../runtime/env/paymenter.env:/var/www/html/.env
      - ../../runtime/data/paymenter/storage:/var/www/html/storage
      - ../../runtime/data/provisioning:/var/runtime/data/provisioning
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sloth-cloud-net
      - sloth-convoy-net

  sloth-cloud-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      network: host
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        http_proxy: ${build_http_proxy:-}
        https_proxy: ${build_https_proxy:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
        no_proxy: ${build_no_proxy:-}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    container_name: sloth-cloud-api
    restart: unless-stopped
    depends_on:
      - sloth-cloud-proxy-relay
      - sloth-cloud-paymenter
    ports:
      - "${SLOTH_API_PORT:-14000}:4000"
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      NO_PROXY: ${NO_PROXY:-}
      no_proxy: ${no_proxy:-}
    volumes:
      - ../../runtime/env/api.env:/app/apps/api/.env
      - ../../runtime/data/kubeconfig:/var/runtime/kubeconfig:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sloth-cloud-net
      - sloth-convoy-net

  sloth-cloud-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      network: host
      args:
        VITE_API_BASE_URL: ${SLOTH_API_PUBLIC_URL}
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        http_proxy: ${build_http_proxy:-}
        https_proxy: ${build_https_proxy:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
        no_proxy: ${build_no_proxy:-}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    container_name: sloth-cloud-web
    restart: unless-stopped
    depends_on:
      - sloth-cloud-proxy-relay
      - sloth-cloud-api
    ports:
      - "${SLOTH_WEB_PORT:-13000}:80"
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      NO_PROXY: ${NO_PROXY:-}
      no_proxy: ${no_proxy:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sloth-cloud-net

networks:
  sloth-cloud-net:
    name: sloth-cloud-net
    driver: bridge
  sloth-convoy-net:
    external: true
    name: sloth-convoy-net
